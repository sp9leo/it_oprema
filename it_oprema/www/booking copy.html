{% extends "templates/web.html" %}

{% block page_content %}<div class="container py-5">

    <!-- HEADER -->
    <div class="text-center mb-5">
        <h2 class="font-weight-bold">Rezervacije</h2>
        <p class="text-muted">Izberite osebo ali sredstvo in rezervirajte prost termin</p>
    </div>

    <!-- SELECT BOOKABLE ITEM -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <label class="font-weight-bold text-muted">Izberite osebo ali sredstvo</label>
            <select id="item-select" class="form-control">
                <option value="">-- Izberite --</option>
                {% for i in items %}
                    <option value="{{ i.name }}">{{ i.item_name }}</option>
                {% endfor %}
            </select>
        </div>
    </div>

    <!-- AVAILABLE SLOTS -->
    <div id="slots-container" class="mt-4" style="display:none;">
        <h4 class="mb-3">Prosti termini</h4>
        <div id="slots-list"></div>
    </div>

    <!-- LOADING SPINNER -->
    <div id="loading" class="text-center my-5" style="display:none;">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="text-muted mt-2">Nalaganje...</p>
    </div>

</div>

{% endblock %}
