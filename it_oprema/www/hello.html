
<html>
  <head>
    <title>Pregled aktivnosti</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  </head>
  <body>
    <div class="container-fluid">
      <div class="row">
        <div class="col-12">
          <div class="card mt-2 shadow-sm">
            <div class="card-body">
              <h5 class="card-title font-weight-bold pb-2">
                Pregled aktivnosti
              </h5>

              <!-- Event type chips -->
              <span class="badge badge-pill text-white mr-1" style="background-color: blue">Meeting</span>
              <span class="badge badge-pill text-white mr-1" style="background-color: green">Workshop</span>
              <span class="badge badge-pill text-white mr-1" style="background-color: red">Deadline</span>

              <!-- Scrollable list -->
              <div style="max-height: 800px; overflow-y: auto;">
                <!-- Example day block -->
                <div class="row border-bottom mb-4 pb-4 pt-4">
                  <!-- Date column -->
                  <div class="col-sm-2 px-4 text-sm-left">
                    <strong class="h5 text-primary">17.12.2025</strong><br />
                    <em class="text-muted">Sreda</em>
                    <span class="badge badge-secondary ml-2">danes</span>
                  </div>

                  <!-- Events column -->
                  <div class="col-sm-10">
                    <div class="border mb-3 p-2">
                      <span class="badge badge-danger ml-2">zdaj</span>
                      <div class="row align-items-center">
                        <!-- Event title -->
                        <div class="col-sm-4 d-flex align-items-center">
                          <div style="background-color: blue; width:4px; height:50px;" class="mr-2"></div>
                          <div class="font-weight-bold">
                            Projektni sestanek<br />
                            <span class="badge badge-info ml-2">09:00 – 10:00</span>
                          </div>
                        </div>

                        <!-- Description -->
                        <div class="col-sm-4 text-muted">
                          Pregled napredka
                        </div>

                        <!-- Participants -->
                        <div class="col-sm-2 text-muted">
                          Janez, Ana
                        </div>

                        <!-- Category -->
                        <div class="col-sm-2">
                          <span class="badge text-white" style="background-color: blue">
                            Sestanek
                          </span>
                        </div>
                      </div>
                    </div>

                    <!-- Another example event -->
                    <div class="border mb-3 p-2">
                      <div class="row align-items-center">
                        <div class="col-sm-4 d-flex align-items-center">
                          <div style="background-color: green; width:4px; height:50px;" class="mr-2"></div>
                          <div class="font-weight-bold">
                            Delavnica<br />
                            <span class="badge badge-secondary ml-2">17.12 – 18.12</span>
                          </div>
                        </div>
                        <div class="col-sm-4 text-muted">Ni opisa</div>
                        <div class="col-sm-2 text-muted">Ni udeležencev</div>
                        <div class="col-sm-2">
                          <span class="badge text-white" style="background-color: green">
                            Workshop
                          </span>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                <!-- Fallback example -->
                <!-- <div class="alert alert-info">Ni aktivnosti za prikaz.</div> -->
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
