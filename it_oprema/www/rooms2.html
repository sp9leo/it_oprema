{% extends "templates/web.html" %}

{% block page_content %}
<div class="container">
    <h1 class="text-2xl font-bold mb-4">Room Reservations</h1>

    <div class="flex items-center gap-4 mb-4">
        <select id="room-select" class="border p-2 rounded">
            {% for room in rooms %}
                <option value="{{ room.name }}">{{ room.item_name }}</option>
            {% endfor %}
        </select>

        <button id="prev-week" class="px-3 py-1 border rounded">← Previous</button>
        <button id="next-week" class="px-3 py-1 border rounded">Next →</button>
    </div>

    <table id="weekly-table" class="table table-bordered w-full text-center">
        <thead>
            <tr>
                <th>Time</th>
                {% for day in ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"] %}
                    <th>{{ day }}</th>
                {% endfor %}
            </tr>
        </thead>
        <tbody id="weekly-body">
            <!-- JS will fill this -->
        </tbody>
    </table>
</div>

<style>
    .slot {
        padding: 4px;
        border-radius: 4px;
        font-size: 0.8rem;
    }
    .slot.free {
        cursor: pointer;
        background: #e8faff;
        transition: background 0.2s;
    }
    .slot.free:hover {
        background: #d0f2ff;
    }
    .slot.full {
        background: #f3f3f3;
        color: #888;
    }
</style>

<script src="/assets/it_oprema/js/rooms.js"></script>
{% endblock %}
